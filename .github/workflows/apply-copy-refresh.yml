name: Apply copy and Frogger identity refresh

on:
  push:
    paths:
      - '.github/workflows/apply-copy-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply copy and identity changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def apply(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old!r}")
                  text = text.replace(old, new)
              p.write_text(text)

          apply('index.html', [
              ('<meta property="og:description" content="Five players. One tiny crown. An entire year of bragging rights.">',
               '<meta property="og:description" content="Five players. One family championship. An entire year of bragging rights.">'),
              ('<meta name="twitter:description" content="Five players. One tiny crown. An entire year of bragging rights.">',
               '<meta name="twitter:description" content="Five players. One family championship. An entire year of bragging rights.">'),
              ('<span class="window-title">FAMILY COMPUTER · PARCHEESI.EXE</span>',
               '<span class="window-title">FROGGER LEAGUE · PARCHEESI.EXE</span>'),
              ('<div class="hero-kicker">🐅 2026 FAM PARCHEESI 🐪</div>',
               '<div class="hero-kicker">🐸 FROGGER LEAGUE · 2026 SEASON</div>'),
              ('<h1 id="pageTitle">The family title race,<br><span>beautifully over-serious.</span></h1>',
               '<h1 id="pageTitle">The family title race,<br><span>in all its glory.</span></h1>'),
              ('<p class="hero-copy">Five players. One tiny crown. An entire year of bragging rights.</p>',
               '<p class="hero-copy">Five players. One family championship. An entire year of bragging rights.</p>'),
              ('<div class="leader-detail skeleton-text" id="leaderDetail">Calculating the family drama</div>',
               '<div class="leader-detail skeleton-text" id="leaderDetail">Calculating championship drama…</div>'),
              ('<p>Watch the season wobble, lurch, and somehow become statistically meaningful.</p>',
               '<p>Watch the season twist, turn, and tighten one game at a time.</p>'),
              ('<strong>Family Parcheesi · 2026</strong>',
               '<strong>Frogger Family Parcheesi League · 2026</strong>'),
              ('<span>Handcrafted for excessive statistical analysis of a perfectly normal board game.</span>',
               '<span>Keeping the official record of every win, streak, comeback, and lead change.</span>'),
          ])

          apply('app.js', [
              ("$('#leaderRibbon').textContent = leaders.length === 1 ? '👑 currently wearing the tiny crown' : '👑 shared tiny crown situation';",
               "$('#leaderRibbon').textContent = leaders.length === 1 ? '👑 currently holds the crown' : '👑 the crown is currently shared';"),
              ("      : `${joinNames(mostPresent)}: ${maxParticipation}/${data.games.length} games. Nathan: ${derived.totals.Nathan.gamesPlayed}/${data.games.length}.`;",
               "      : `${joinNames(mostPresent)} ${mostPresent.length === 1 ? 'leads' : 'lead'} attendance at ${maxParticipation}/${data.games.length} games.`;"),
          ])

          apply('scripts/generate_brand_assets.py', [
              ('txt = "FAMILY COMPUTER · PARCHEESI.EXE"',
               'txt = "FROGGER LEAGUE · PARCHEESI.EXE"'),
              ('d.text((left, 670), "Five players. One tiny crown.", font=font(48), fill=C["ink"])',
               'd.text((left, 670), "Five players. One family championship.", font=font(48), fill=C["ink"])'),
              ('"name": "Family Parcheesi · 2026 Championship",',
               '"name": "Frogger Family Parcheesi League · 2026 Championship",'),
              ('"description": "The family Parcheesi championship: standings, streaks, stats, and the great 2026 race.",',
               '"description": "The Frogger Family Parcheesi League: 2026 standings, streaks, stats, and title race.",'),
          ])

          status = Path('STATUS.md')
          s = status.read_text()
          marker = '## League identity and copy direction\n'
          if marker not in s:
              insertion = '''\n## League identity and copy direction\n\nThe family-world name is **Frogger Family Parcheesi League**, shortened to **Frogger League** in compact UI chrome. References stay deliberately sparse: the faux-Mac title bar, one hero season identifier, and the footer.\n\nCopy direction is now **earnest underneath, playful on top**: treat the championship as a real family institution, while letting the presentation be dramatic, mock-serious, and fun. Humor should come from the grand sports-broadcast treatment, not from diminishing the game or tradition.\n\n'''
              s = s.replace('## Architecture\n', insertion + '## Architecture\n', 1)
              status.write_text(s)
          PY

      - name: Regenerate share artwork and manifest
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_brand_assets.py

      - name: Validate changes
        shell: bash
        run: |
          node --check app.js
          python -m py_compile scripts/generate_brand_assets.py
          python -m json.tool site.webmanifest >/dev/null
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text()
          app = Path('app.js').read_text()
          generator = Path('scripts/generate_brand_assets.py').read_text()
          stale = [
              'tiny crown',
              'beautifully over-serious',
              'somehow become statistically meaningful',
              'excessive statistical analysis of a perfectly normal board game',
          ]
          combined = '\n'.join([index, app, generator])
          found = [phrase for phrase in stale if phrase in combined]
          if found:
              raise SystemExit(f'Stale tone copy remains: {found}')
          required = [
              'FROGGER LEAGUE · PARCHEESI.EXE',
              'Frogger Family Parcheesi League · 2026',
              'The family title race,<br><span>in all its glory.</span>',
              'currently holds the crown',
          ]
          missing = [phrase for phrase in required if phrase not in combined]
          if missing:
              raise SystemExit(f'Required refreshed copy missing: {missing}')
          PY
          git diff --check

      - name: Commit refreshed site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js scripts/generate_brand_assets.py site.webmanifest assets/og-share.png STATUS.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine championship voice and add Frogger League identity"
          git push origin HEAD:main
