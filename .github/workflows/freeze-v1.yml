name: Freeze v1.0.0

on:
  push:
    paths:
      - .github/workflows/freeze-v1.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable v1.0.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: d5a32f364e4c114f9e7e4063cc6f60daead6305b
        run: |
          set -euo pipefail

          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v1.0.0' \
              -f sha="$TARGET_SHA"
          fi

          if ! gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.0.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title 'Family Parcheesi v1.0.0 — First Live Release' \
              --notes $'The first approved live release of the Family Parcheesi website.\n\nThis release permanently freezes the exact site Ben reviewed and approved after enabling GitHub Pages on October 3, 2026.\n\nVersion snapshot commit: `d5a32f364e4c114f9e7e4063cc6f60daead6305b`\n\nFuture development continues on `main`; `v1.0.0` remains the restore point for this first live version.'
          fi
