name: Apply latest attendance wording v2

on:
  push:
    paths:
      - '.github/workflows/apply-latest-attendance-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update latest-game attendance copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          text = p.read_text()
          old = """      const absentees = data.players.filter(player => !derived.latest.participants.includes(player));
      $('#latestMeta').textContent = `${formatDate(derived.latest.date)}${absentees.length ? ` · no ${joinNames(absentees)}` : ' · full table'}`;
"""
          new = """      const participantCount = derived.latest.participants.length;
      const attendanceLabel = participantCount === data.players.length
        ? 'full table'
        : `${participantCount} ${plural('player', participantCount)} at the table`;
      $('#latestMeta').textContent = `${formatDate(derived.latest.date)} · ${attendanceLabel}`;
"""
          if old not in text:
              raise SystemExit('Expected latest-game block not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Use player-count wording for latest game"
          git push origin HEAD:main
