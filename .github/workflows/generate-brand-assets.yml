name: Generate brand assets

on:
  push:
    paths:
      - .github/workflows/generate-brand-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate icon and share assets
        run: python scripts/generate_brand_assets.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicon-16x16.png assets/favicon-32x32.png assets/favicon-48x48.png \
                  assets/apple-touch-icon.png assets/icon-192.png assets/icon-512.png \
                  assets/og-share.png assets/safari-pinned-tab.svg favicon.ico site.webmanifest
          git commit -m "Add complete Family Parcheesi brand asset set"
          git push
