name: Create v2 release snapshot

on:
  push:
    paths:
      - '.github/workflows/create-v2-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable v2 restore point
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_SHA="d9e087b6f4065ff9c13cd453e45b31ee01a17007"
          TAG="v2.0.0"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SNAPSHOT_SHA" -m "Family Parcheesi v2.0.0 — Frogger League Refresh"
          git push origin "$TAG"

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Family Parcheesi v2.0.0 — Frogger League Refresh" \
            --notes $'The second approved live release of the Family Parcheesi website.\n\nThis release freezes the exact site Ben reviewed and approved on October 3, 2026 after the warmer championship copy refresh, subtle Frogger League identity, corrected October 3 attendance data, and automatic latest-game player-count wording.\n\nVersion snapshot commit: `d9e087b6f4065ff9c13cd453e45b31ee01a17007`\n\nFuture development continues on `main`; `v2.0.0` remains the restore point for this approved second live version.'
