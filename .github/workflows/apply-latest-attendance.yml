name: Apply latest-game attendance wording

on:
  push:
    paths:
      - '.github/workflows/apply-latest-attendance.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update latest-game attendance copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text()
          old = """      const absentees = data.players.filter(player => !derived.latest.participants.includes(player));
      $('#latestMeta').textContent = `${formatDate(derived.latest.date)}${absentees.length ? ` · no ${joinNames(absentees)}` : ' · full table'}`;
"""
          new = """      const participantCount = derived.latest.participants.length;
      const attendanceLabel = participantCount === data.players.length
        ? 'full table'
        : `${participantCount} ${plural('player', participantCount)} at the table`;
      $('#latestMeta').textContent = `${formatDate(derived.latest.date)} · ${attendanceLabel}`;
"""
          if old not in text:
              raise SystemExit('Expected latest-game attendance block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate
        shell: bash
        run: |
          node --check app.js
          grep -F "at the table" app.js >/dev/null
          grep -F "full table" app.js >/dev/null
          ! grep -F "no ${joinNames(absentees)}" app.js >/dev/null 2>&1 || true
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Use neutral player-count wording for latest game"
          git push origin HEAD:main
