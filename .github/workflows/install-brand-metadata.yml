name: Install brand metadata

on:
  push:
    paths:
      - .github/workflows/install-brand-metadata.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser, iOS, and social metadata
        run: python scripts/install_brand_metadata.py
      - name: Commit metadata integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md STATUS.md
          git commit -m "Add Safari iOS and social share metadata"
          git push
