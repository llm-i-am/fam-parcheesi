name: Apply final visual and QA polish

on:
  push:
    paths:
      - '.github/workflows/final-polish-pass.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          css_path = Path('styles.css')
          css = css_path.read_text()

          css = replace_once(
              css,
              '.hero-window{margin:0 0 34px;border:2px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 4px 0 var(--line),0 18px 40px rgba(75,54,31,.14);overflow:hidden}',
              '.hero-window{margin:0 0 34px;border:2px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#f8efd8 0%,#f2e7cf 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 0 var(--line),0 18px 40px rgba(75,54,31,.14);overflow:hidden}',
              'hero surface'
          )
          css = replace_once(
              css,
              '.leader-card,.latest-card{position:relative;border:2px solid var(--line);border-radius:var(--radius);background:var(--panel-strong);box-shadow:3px 3px 0 var(--line)}',
              '.leader-card,.latest-card{position:relative;border:2px solid var(--line);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,255,255,.48),3px 3px 0 var(--line)}',
              'hero cards shared surface'
          )
          css = replace_once(
              css,
              '.leader-card{padding:18px;overflow:hidden}\n.leader-card::after{content:"";position:absolute;right:-26px;bottom:-34px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(216,155,45,.24),transparent 68%);pointer-events:none}',
              '.leader-card{padding:18px;overflow:hidden;background:radial-gradient(circle at 104% 108%,rgba(216,155,45,.18) 0%,rgba(216,155,45,.08) 34%,transparent 58%),linear-gradient(145deg,#fffaf0 0%,#fff5df 100%)}',
              'leader card gradient'
          )
          css = replace_once(
              css,
              '.leader-ribbon{display:inline-flex;align-items:center;min-height:28px;padding:5px 9px;border:1.5px solid var(--line);border-radius:999px;background:#ffe79d;font:800 11px/1 var(--font-mono);letter-spacing:.035em;text-transform:uppercase}',
              '.leader-ribbon{display:inline-flex;align-items:center;max-width:100%;min-height:28px;padding:5px 9px;border:1.5px solid var(--line);border-radius:999px;background:linear-gradient(180deg,#fff1b4,#ffe087);box-shadow:inset 0 1px 0 rgba(255,255,255,.75);font:800 11px/1.15 var(--font-mono);letter-spacing:.035em;text-transform:uppercase}',
              'leader ribbon polish'
          )
          css = replace_once(
              css,
              '.latest-card{padding:16px 17px;background:linear-gradient(135deg,#e9ddbd,#f8edd3)}',
              '.latest-card{padding:16px 17px;background:linear-gradient(145deg,#efe4c8 0%,#fbf1dc 58%,#f4e5c9 100%)}',
              'latest card gradient'
          )
          css = replace_once(
              css,
              '.pawn{position:relative;display:inline-block;width:22px;height:22px;color:var(--pawn-color,var(--gold))}\n.pawn::before{content:"";position:absolute;left:50%;top:0;width:9px;height:9px;transform:translateX(-50%);border:1.5px solid var(--line);border-radius:50%;background:currentColor}\n.pawn::after{content:"";position:absolute;left:50%;bottom:0;width:17px;height:12px;transform:translateX(-50%);clip-path:polygon(34% 0,66% 0,82% 64%,100% 75%,100% 100%,0 100%,0 75%,18% 64%);border-bottom:1.5px solid var(--line);background:currentColor;filter:drop-shadow(0 1px 0 var(--line))}\n.pawn-xl{width:43px;height:43px}\n.pawn-xl::before{width:17px;height:17px;border-width:2px}\n.pawn-xl::after{width:34px;height:24px;filter:drop-shadow(0 2px 0 var(--line))}',
              '.pawn{position:relative;display:inline-block;width:22px;height:22px;color:var(--pawn-color,var(--gold));filter:drop-shadow(.75px 0 0 var(--line)) drop-shadow(-.75px 0 0 var(--line)) drop-shadow(0 .75px 0 var(--line)) drop-shadow(0 -.75px 0 var(--line))}\n.pawn::before{content:"";position:absolute;left:50%;top:0;width:9px;height:9px;transform:translateX(-50%);border:1.5px solid currentColor;border-radius:50%;background:currentColor}\n.pawn::after{content:"";position:absolute;left:50%;bottom:0;width:17px;height:12px;transform:translateX(-50%);clip-path:polygon(34% 0,66% 0,82% 64%,100% 75%,100% 100%,0 100%,0 75%,18% 64%);background:currentColor}\n.pawn-xl{width:43px;height:43px;filter:drop-shadow(1.25px 0 0 var(--line)) drop-shadow(-1.25px 0 0 var(--line)) drop-shadow(0 1.25px 0 var(--line)) drop-shadow(0 -1.25px 0 var(--line))}\n.pawn-xl::before{width:17px;height:17px;border-width:2px}\n.pawn-xl::after{width:34px;height:24px}',
              'continuous pawn outline'
          )
          css = replace_once(
              css,
              '.hero-window,.retro-panel,.leader-card,.latest-card,.stat-card,.history-entry,.season-chip,.history-toggle,.footer-mark{box-shadow:3px 3px 0 #0d0b0f,0 14px 30px rgba(0,0,0,.20)}',
              '.hero-window,.retro-panel,.leader-card,.latest-card,.stat-card,.history-entry,.season-chip,.history-toggle,.footer-mark{box-shadow:inset 0 1px 0 rgba(255,255,255,.055),3px 3px 0 #0d0b0f,0 14px 30px rgba(0,0,0,.22)}',
              'dark surface depth'
          )
          css = replace_once(
              css,
              '  .window-bar{background:repeating-linear-gradient(0deg,#2b252d 0 2px,#171319 2px 4px)}',
              '  .hero-window{background:linear-gradient(180deg,#221e25 0%,#1d1a20 100%)}\n  .window-bar{background:repeating-linear-gradient(0deg,#2b252d 0 2px,#171319 2px 4px)}',
              'dark hero gradient'
          )
          css = replace_once(
              css,
              '  .latest-card{background:linear-gradient(135deg,#2d2729,#241f25)}\n  .leader-ribbon{background:#4b3c18;color:#ffe59a}',
              '  .leader-card{background:radial-gradient(circle at 104% 108%,rgba(216,155,45,.17) 0%,rgba(216,155,45,.065) 34%,transparent 58%),linear-gradient(145deg,#2d272e 0%,#282329 62%,#241f26 100%)}\n  .latest-card{background:linear-gradient(145deg,#302a2f 0%,#292329 58%,#231f25 100%)}\n  .leader-ribbon{background:linear-gradient(180deg,#55441b,#443515);color:#ffe8a4;box-shadow:inset 0 1px 0 rgba(255,232,164,.12)}',
              'dark hero card gradients'
          )
          css_path.write_text(css)

          html_path = Path('index.html')
          html = html_path.read_text()
          html = replace_once(html, '<div class="stat-label">LONGEST DROUGHT</div>', '<div class="stat-label">CURRENT DROUGHT</div>', 'drought label')
          html_path.write_text(html)

          js_path = Path('app.js')
          js = js_path.read_text()
          js = replace_once(
              js,
              "    if (!Array.isArray(data.players) || data.players.length === 0) throw new Error('Players must be a non-empty array.');\n    if (new Set(data.players).size !== data.players.length) throw new Error('Players must be unique.');\n    if (!Array.isArray(data.games)) throw new Error('Games must be an array.');",
              "    if (!Array.isArray(data.players) || data.players.length === 0) throw new Error('Players must be a non-empty array.');\n    if (data.players.some(player => typeof player !== 'string' || !player.trim())) throw new Error('Every player must have a non-empty name.');\n    if (new Set(data.players).size !== data.players.length) throw new Error('Players must be unique.');\n    if (!Array.isArray(data.games)) throw new Error('Games must be an array.');",
              'player validation'
          )
          js = replace_once(
              js,
              "      if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(game.date)) throw new Error(`Game ${index + 1} has an invalid date.`);\n      if (game.date < previousDate) throw new Error('Games must be sorted chronologically.');",
              "      if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(game.date)) throw new Error(`Game ${index + 1} has an invalid date.`);\n      const parsedDate = new Date(`${game.date}T00:00:00Z`);\n      if (Number.isNaN(parsedDate.getTime()) || parsedDate.toISOString().slice(0, 10) !== game.date) throw new Error(`Game ${index + 1} has an impossible calendar date.`);\n      if (!game.date.startsWith(`${data.season}-`)) throw new Error(`Game ${index + 1} is outside the ${data.season} season.`);\n      if (game.date < previousDate) throw new Error('Games must be sorted chronologically.');",
              'date validation'
          )
          js = replace_once(
              js,
              "      busyMonth: busiestMonth(data.games),\n      drought: longestCurrentDrought(data),\n      lastWin: Object.fromEntries(data.players.map(player => [player, latestWin(data.games, player)]))",
              "      busyMonth: busiestMonth(data.games),\n      drought: currentDrought(data)",
              'derived cleanup'
          )
          js = replace_once(js, '  function longestCurrentDrought(data) {', '  function currentDrought(data) {', 'drought function name')
          latest_win = """\n  function latestWin(games, player) {\n    for (let i = games.length - 1; i >= 0; i -= 1) {\n      if (games[i].winner === player) return games[i];\n    }\n    return null;\n  }\n"""
          if js.count(latest_win) != 1:
              raise SystemExit(f'latestWin cleanup: expected 1 match, found {js.count(latest_win)}')
          js = js.replace(latest_win, '\n', 1)
          js = replace_once(
              js,
              "    $('#seasonChip').textContent = `${data.season} · ${data.games.length} games`;",
              "    $('#seasonChip').textContent = `${data.season} · ${data.games.length} ${plural('game', data.games.length)}`;",
              'season chip grammar'
          )
          js = replace_once(
              js,
              "  function renderStandings() {\n    const list = $('#standingsList');\n    list.innerHTML = state.derived.standings.map((entry, index, standings) => {",
              "  function renderStandings() {\n    const list = $('#standingsList');\n    list.setAttribute('aria-label', `${state.data.season} Parcheesi standings`);\n    list.innerHTML = state.derived.standings.map((entry, index, standings) => {",
              'dynamic standings aria label'
          )
          js = replace_once(
              js,
              "      <title id=\"chartTitle\">2026 Parcheesi ${mode === 'percentage' ? 'championship percentage' : 'cumulative wins'} race</title>\n      <desc id=\"chartDesc\">A line chart showing ${mode === 'percentage' ? 'win percentage among games played' : 'cumulative wins'} for Ben, Mom, Dad, Andrew, and Nathan across the 2026 season.</desc>",
              "      <title id=\"chartTitle\">${data.season} Parcheesi ${mode === 'percentage' ? 'championship percentage' : 'cumulative wins'} race</title>\n      <desc id=\"chartDesc\">A line chart showing ${mode === 'percentage' ? 'win percentage among games played' : 'cumulative wins'} for ${escapeHtml(data.players.join(', '))} across the ${data.season} season.</desc>",
              'dynamic chart accessibility text'
          )
          js = replace_once(
              js,
              "      ? `${recentMax} ${plural('win', recentMax)} in the last ${derived.recentFive.length} games.`",
              "      ? `${recentMax} ${plural('win', recentMax)} in the last ${derived.recentFive.length} ${plural('game', derived.recentFive.length)}.`",
              'hot hand grammar'
          )
          js_path.write_text(js)
          PY

      - name: Validate final site
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python -m json.tool data/games.json >/dev/null
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          html = Path('index.html').read_text()
          css = Path('styles.css').read_text()
          js = Path('app.js').read_text()
          Parser().feed(html)
          assert css.count('{') == css.count('}'), 'CSS brace mismatch'
          assert 'LONGEST DROUGHT' not in html
          assert 'CURRENT DROUGHT' in html
          assert 'skip-link' not in html and 'skip-link' not in css
          assert 'MOST PRESENT' not in html
          assert 'participationValue' not in html and 'participationValue' not in js
          assert 'latestWin(' not in js
          assert 'lastWin:' not in js
          assert 'border-bottom:1.5px solid var(--line);background:currentColor;filter:drop-shadow(0 1px 0 var(--line))' not in css
          assert 'drop-shadow(1.25px 0 0 var(--line))' in css
          assert 'data.season} Parcheesi' in js
          print('HTML/CSS/JS invariant checks passed')
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html app.js
          git commit -m "Polish final visuals and harden scoreboard"
          git push origin HEAD:main
